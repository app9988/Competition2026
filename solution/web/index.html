const fmtT = (s, ...args) => args.reduce((acc,v,i)=>acc.replaceAll("{"+i+"}", String(v)), s);
const LangCtx = createContext(null);
function useLangState(){
  const [lang,setLang]=useState(()=>{
    try{ const v=localStorage.getItem("tj-lang"); if(v==="zh"||v==="en") return v; }catch(e){}
    return (navigator.language||"en").toLowerCase().startsWith("zh") ? "zh" : "en";
  });
  useEffect(()=>{
    try{ localStorage.setItem("tj-lang", lang) }catch(e){}
    document.documentElement.lang = lang;
  },[lang]);
  const t=useCallback((key,...args)=>{
    const s=STRINGS[lang][key] ?? STRINGS.en[key] ?? key;
    return args.length? fmtT(s,...args) : s;
  },[lang]);
  const gateReason=useCallback(raw=>{
    const maps=STRINGS[lang].gate_reasons;
    if(!maps||!raw) return raw;
    for(const [re,tpl] of maps){ const m=raw.match(re); if(m) return raw.replace(re,tpl); }
    return raw;
  },[lang]);
  return {lang,setLang,t,gateReason};
}
const useLang=()=>useContext(LangCtx);

/* ============================================================== helpers ==== */
const api=(p,b)=>fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:undefined).then(r=>{
  if(!r.ok) return r.json().then(e=>{throw new Error(e.detail||r.statusText)});
  return r.json();
});
const HUES=["#38bdf8","#34d399","#fbbf24","#f87171","#a78bfa","#f0abfc","#5eead4","#fdba74"];
const hue=s=>HUES[[...(s||"x")].reduce((a,c)=>a+c.charCodeAt(0),0)%HUES.length];
const fmt=n=>(n??0).toLocaleString();

function Num({v}){
  const [d,setD]=useState(v); const r=useRef(v);
  useEffect(()=>{
    const from=r.current, to=v, t0=performance.now(), dur=520;
    if(from===to){setD(to);return}
    let raf; const step=t=>{
      const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      setD(Math.round(from+(to-from)*e));
      if(k<1) raf=requestAnimationFrame(step); else r.current=to;
    };
    raf=requestAnimationFrame(step);
    // rAF is suspended while the tab is not compositing; guarantee the final value lands
    const settle=setTimeout(()=>{setD(to); r.current=to;}, dur+60);
    return ()=>{cancelAnimationFrame(raf); clearTimeout(settle);};
  },[v]);
  return <>{fmt(d)}</>;
}

function Funnel({tr}){
  const {t}=useLang();
  if(!tr) return <div className="empty">{t("no_trace")}</div>;
  const cat=tr.pool_catalog||50000, s1=tr.pool_stage1||0, s2=tr.pool_stage2||0;
  const w=n=>Math.max(1.5,(Math.log10(Math.max(n,1))/Math.log10(Math.max(cat,10)))*100);
  const rows=[[t("f_catalog"),cat,"var(--bar-1)"],[t("f_bucket"),s1,"var(--bar-2)"],[t("f_filter"),s2,"var(--bar-3)"]];
  return <div className="funnel">
    {rows.map(([lab,n,c])=>
      <div className="fstage" key={lab}>
        <div className="flab">{lab}</div>
        <div className="fbar"><div className="ffill" style={{width:w(n)+"%",background:c}}/></div>
        <div className="fnum"><Num v={n}/></div>
      </div>)}
  </div>;
}

function ProductCard({p,rank,isTarget}){
  const c=hue(p.parent_asin);
  return <div className={"pc"+(isTarget?" tgt":"")}>
    <div className="rk">#{rank}</div>
    <div className="thumb" style={{background:`linear-gradient(135deg,${c},${c}55)`}}>
      {(p.title||"?").trim()[0].toUpperCase()}
    </div>
    <div className="nm" title={p.title}>{p.title}</div>
    <div className="mt">
      <span className="pr">{p.price!=null?`$${p.price}`:"—"}</span>
      <span>★ {p.average_rating??"—"} ({fmt(p.rating_number)})</span>
    </div>
    {p.score!=null && <div className="sc">score {p.score}</div>}
  </div>;
}

function Reasoning({tr,meta}){
  const {t,gateReason}=useLang();
  const LAYER={A:["b-cy",t("layer_A")],B:["b-vi",t("layer_B")],C:["b-dm",t("layer_C")]};
  const [lc,ln]=LAYER[tr?.nlu_layer]||LAYER.C;
  return <div className="scroll">
    <div className="sec">{t("sec_funnel")}</div>
    <div className="box"><Funnel tr={tr}/></div>

    <div className="sec">{t("sec_gate")}</div>
    {tr ? <div className={"gate "+(tr.gate?"open":"shut")}>
        <div className="gt">{tr.gate?t("gate_open"):t("gate_shut")}</div>
        <div className="gr">{gateReason(tr.gate_reason)}</div>
      </div> : <div className="empty">{t("wait_t1")}</div>}

    <div className="sec">{t("sec_turn")}</div>
    <div className="box">
      <div className="rrow"><span>{t("r_layer")}</span><b><span className={"badge "+lc}>{ln}</span></b></div>
      <div className="rrow"><span>{t("r_route")}</span><b>
        <span className={"badge "+(tr?.route==="PRECISION"?"b-gn":"b-am")}>{tr?.route||"—"}</span></b></div>
      <div className="rrow"><span>{t("r_cat")}</span><b>{tr?.category||"—"}</b></div>
      <div className="rrow"><span>{t("r_ask")}</span><b>{tr?.ask_attribute?
        <span className="badge b-cy">{tr.ask_attribute}</span>:"—"}</b></div>
      <div className="rrow"><span>{t("r_lat")}</span><b>{tr?`${tr.latency_ms} ms`:"—"}</b></div>
      <div className="rrow"><span>{t("r_tok")}</span><b>0</b></div>
    </div>

    <div className="sec">{t("sec_system")}</div>
    <div className="box">
      <div className="rrow"><span>{t("s_products")}</span><b>{fmt(meta?.products)}</b></div>
      <div className="rrow"><span>{t("s_cats")}</span><b>{fmt(meta?.categories)}</b></div>
      <div className="rrow"><span>{t("s_spans")}</span><b>{fmt(meta?.span_index_keys)}</b></div>
      <div className="rrow"><span>{t("s_cold")}</span><b>{meta?.build_seconds}s</b></div>
      <div className="rrow"><span>{t("s_deps")}</span><b style={{color:"var(--green)"}}>{t("s_none")}</b></div>
    </div>
  </div>;
}

function Constraints({turns,upto}){
  const {t}=useLang();
  const seen=[]; let pivot=null; const skipped=[];
  turns.slice(0,upto).forEach(x=>{
    (x.trace?.new_constraints||[]).forEach(c=>{ if(!seen.includes(c)) seen.push(c); });
    if(x.trace?.boundary) skipped.push(x.turn);
    if(/ignore my earlier|scratch that|forget|change of plan/i.test(x.user||""))
      pivot=(x.trace?.new_constraints||[])[0]||null;
  });
  if(!seen.length && !skipped.length) return <div className="empty">{t("no_cons")}</div>;
  return <div>
    {seen.map((c,i)=>{
      const isP=pivot&&c===pivot;
      return <div className={"cons "+(isP?"pivot":"add")} key={i}>
        <div className="ic">{isP?"⟳":"✓"}</div><code>{c}</code></div>;
    })}
    {skipped.map(x=><div className="cons skip" key={"s"+x}>
      <div className="ic">✗</div><code>{t("cons_skip",x)}</code></div>)}
  </div>;
}

function Profile({p}){
  const {t}=useLang();
  if(!p) return null;
  return <div className="box">
    <div className="kv"><span>{t("p_freq")}</span><b>{p.purchase_frequency}</b></div>
    <div className="kv"><span>{t("p_avg")}</span><b>{p.average_prior_rating}</b></div>
    <div className="kv"><span>{t("p_style")}</span><b>{p.rating_style}</b></div>
    <div className="tags">{(p.preference_tags||[]).map(x=><span className="tag" key={x}>{x}</span>)}</div>
  </div>;
}

/* =====================================================  REPLAY  =========== */
function Replay({meta}){
  const {t}=useLang();
  const [samples,setSamples]=useState([]);
  const [filter,setFilter]=useState("all");
  const [para,setPara]=useState(false);
  const [sel,setSel]=useState(null);
  const [data,setData]=useState(null);
  const [upto,setUpto]=useState(0);
  const [playing,setPlaying]=useState(false);
  const [busy,setBusy]=useState(false);
  const streamRef=useRef(null);

  useEffect(()=>{api("/api/samples").then(setSamples)},[]);
  useEffect(()=>{
    if(!playing||!data) return;
    if(upto>=data.turns.length){setPlaying(false);return}
    const id=setTimeout(()=>setUpto(u=>u+1),1400);
    return ()=>clearTimeout(id);
  },[playing,upto,data]);
  useEffect(()=>{
    if(streamRef.current) streamRef.current.scrollTop=streamRef.current.scrollHeight;
  },[upto,data]);

  const run=async(s,p=para)=>{
    setSel(s.sample_id); setBusy(true); setData(null); setUpto(0); setPlaying(false);
    try{
      const d=await api("/api/replay",{sample_id:s.sample_id,paraphrase:p});
      setData(d); setUpto(1); setPlaying(true);
    }finally{ setBusy(false) }
  };
  const togglePara=()=>{
    const np=!para; setPara(np);
    const cur=samples.find(s=>s.sample_id===sel);
    if(cur) run(cur,np);                    // re-run the open session under the new mode
  };

  const shown=data?data.turns.slice(0,upto):[];
  const cur=shown.length?shown[shown.length-1]:null;
  const done=data&&upto>=data.turns.length;
  const list=samples.filter(s=>filter==="all"||s.scenario_type===filter);

  return <div className="main">
    {/* ------------------------------------------------------------ left --- */}
    <div className="col l"><div className="scroll">
      <label className={"ptoggle"+(para?" on":"")}>
        <input type="checkbox" checked={para} onChange={togglePara}/>
        <div>
          <div className="pt-title">{t("para_toggle")}</div>
          <div className="pt-desc">{t("para_desc")}</div>
        </div>
      </label>
      <div className="sec" style={{marginTop:16}}>{t("sec_samples",samples.length)}</div>
      <div className="filt">
        {["all","buying","browsing","intent_override","boundary"].map(f=>
          <button key={f} className={filter===f?"on":""} onClick={()=>setFilter(f)}>
            {f==="all"?t("filt_all"):f}</button>)}
      </div>
      {list.slice(0,60).map(s=>
        <div key={s.sample_id} className={"samp"+(sel===s.sample_id?" on":"")} onClick={()=>run(s)}>
          <div><span className="id">{s.sample_id}</span>
            <span className={"pill p-"+s.scenario_type}>{s.scenario_type}</span></div>
          <div className="ti">{s.category} — {s.target_title}</div>
        </div>)}
    </div></div>

    {/* ---------------------------------------------------------- center --- */}
    <div className="col">
      <div className="stream" ref={streamRef}>
        {!data && !busy && <div className="empty" style={{margin:"auto",textAlign:"center",whiteSpace:"pre-line"}}>
          {t("empty_replay")}</div>}
        {busy && <div style={{margin:"auto",textAlign:"center"}}><div className="spin"/>
          <div style={{marginTop:10,color:"var(--muted)",fontSize:12}}>{t("busy_replay")}</div></div>}

        {data?.paraphrased && shown.length>0 &&
          <div className="parabanner">🔀 {t("para_badge")} — {t("para_desc")}</div>}

        {shown.map(x=><React.Fragment key={x.turn}>
          <div className="turnmark">{t("turn",x.turn)}{x.counts===false && " · "+t("pre_override")}</div>
          <div className="msg u"><div className="av u">U</div><div className="bub">{x.user}</div></div>
          <div className="msg"><div className="av a">AI</div><div className="bub">{x.reply}</div></div>
          {!x.trace?.gate && <HeldBar reason={x.trace?.gate_reason}/>}
          {x.items.length>0 &&
            <div className="grid">{x.items.map((p,i)=>
              <ProductCard key={p.parent_asin} p={p} rank={i+1}
                isTarget={data&&p.parent_asin===data.target.parent_asin}/>)}</div>}
        </React.Fragment>)}

        {data && done && <div className={"verdict "+(data.hit?"hit":"miss")}>
          <div className="vm"><span>{t("v_result")}</span><b style={{color:data.hit?"var(--green)":"var(--red)"}}>
            {data.hit?"HIT":"MISS"}</b></div>
          <div className="vm"><span>{t("v_hit_turn")}</span><b>{data.first_hit_turn??"—"}</b></div>
          <div className="vm"><span>{t("v_rank")}</span><b>#{data.best_rank??"—"}</b></div>
          <div className="vm"><span>{t("v_rr")}</span><b>{data.reciprocal_rank}</b></div>
          <div className="vm" style={{marginLeft:"auto",textAlign:"right"}}>
            <span>{t("v_target")}</span><b style={{fontSize:11}}>{data.target.parent_asin}</b></div>
        </div>}
      </div>

      {data && <div className="pbar">
        <button disabled={upto<=1} onClick={()=>{setPlaying(false);setUpto(u=>u-1)}}>{t("pb_prev")}</button>
        <button onClick={()=>setPlaying(p=>!p)} disabled={done}>{playing?t("pb_pause"):t("pb_play")}</button>
        <button disabled={done} onClick={()=>{setPlaying(false);setUpto(u=>u+1)}}>{t("pb_next")}</button>
        <button onClick={()=>{setPlaying(false);setUpto(data.turns.length)}}>{t("pb_skip")}</button>
        <span className="sp">{t("pb_pos",upto,data.turns.length,data.scenario_type)}
          {data.paraphrased && <span className="badge b-am" style={{marginLeft:8}}>{t("para_badge")}</span>}</span>
      </div>}
    </div>

    {/* ----------------------------------------------------------- right --- */}
    <div className="col r">
      <Reasoning tr={cur?.trace} meta={meta}/>
      <div className="scroll" style={{flex:"none",borderTop:"1px solid var(--line)",maxHeight:"42%"}}>
        <div className="sec">{t("sec_cons")}</div>
        <Constraints turns={data?.turns||[]} upto={upto}/>
        {data && <>
          <div className="sec">{t("sec_profile")}</div>
          <Profile p={data.profile}/>
          {done && <>
            <div className="sec" style={{color:"var(--violet)"}}>{t("sec_hidden")}</div>
            <div className="box hidden-card">
              {(data.hidden_card.hard_constraints||[]).map((c,i)=>
                <div className="rrow" key={"h"+i}><span>hard[{i}]</span><b>{c.slice(0,60)}</b></div>)}
              {(data.hidden_card.soft_preferences||[]).map((c,i)=>
                <div className="rrow" key={"s"+i}><span>soft[{i}]</span><b>{c.slice(0,60)}</b></div>)}
            </div>
          </>}
        </>}
      </div>
    </div>
  </div>;
}

function HeldBar({reason}){
  const {t,gateReason}=useLang();
  return <div className="held">⏸ {t("held")}{gateReason(reason)}</div>;
}

/* ======================================================  LIVE  ============ */
const HINTS=[
  "I'm looking for Watches Wrist Watches, but I'm still exploring.",
  "I'm looking for Jewelry Necklaces. A key requirement is: Material:alloy.",
  "Hi there - I'm after Accessories Belts. The one thing I really care about: 100% Leather.",
  "For that, what matters is: Water Resistant; 3 Year Battery.",
];

function Live({meta}){
  const {t}=useLang();
  const [sid,setSid]=useState(null);
  const [msgs,setMsgs]=useState([]);
  const [text,setText]=useState("");
  const [busy,setBusy]=useState(false);
  const [profile,setProfile]=useState(null);
  const streamRef=useRef(null);

  const boot=useCallback(async()=>{
    const s=await api("/api/session",{}); setSid(s.session_id); setProfile(s.profile); setMsgs([]);
  },[]);
  useEffect(()=>{boot()},[boot]);
  useEffect(()=>{if(streamRef.current)streamRef.current.scrollTop=streamRef.current.scrollHeight},[msgs]);

  const send=async v=>{
    const q=(v??text).trim(); if(!q||!sid||busy) return;
    setText(""); setBusy(true);
    setMsgs(m=>[...m,{who:"u",text:q}]);
    try{
      const r=await api("/api/chat",{session_id:sid,message:q});
      setMsgs(m=>[...m,{who:"a",text:r.reply,items:r.items,trace:r.trace}]);
    }catch(e){ setMsgs(m=>[...m,{who:"a",text:"⚠ "+e.message}]) }
    finally{ setBusy(false) }
  };

  const lastTrace=[...msgs].reverse().find(m=>m.trace)?.trace;
  const turns=msgs.filter(m=>m.trace).map(m=>({turn:m.trace.turn,user:"",trace:m.trace}));

  return <div className="main">
    <div className="col l"><div className="scroll">
      <div className="sec">{t("sec_session")}</div>
      <Profile p={profile}/>
      <div className="sec">{t("sec_cons")}</div>
      <Constraints turns={turns} upto={turns.length}/>
      <div className="sec">{t("sec_actions")}</div>
      <div className="box" style={{cursor:"pointer"}} onClick={boot}>
        <div style={{fontSize:12,color:"var(--cyan)"}}>{t("new_session")}</div>
        <div style={{fontSize:11,color:"var(--dim)",marginTop:3}}>{t("new_session_desc")}</div>
      </div>
    </div></div>

    <div className="col">
      <div className="stream" ref={streamRef}>
        {!msgs.length && <div className="empty" style={{margin:"auto",textAlign:"center",whiteSpace:"pre-line"}}>
          {t("empty_live")}</div>}
        {msgs.map((m,i)=><React.Fragment key={i}>
          {m.trace && <div className="turnmark">{t("turn",m.trace.turn)}</div>}
          <div className={"msg"+(m.who==="u"?" u":"")}>
            <div className={"av "+m.who}>{m.who==="u"?"U":"AI"}</div>
            <div className="bub">{m.text}</div></div>
          {m.trace && !m.trace.gate && <HeldBar reason={m.trace.gate_reason}/>}
          {m.items?.length>0 && <div className="grid">
            {m.items.map((p,j)=><ProductCard key={p.parent_asin} p={p} rank={j+1}/>)}</div>}
        </React.Fragment>)}
        {busy && <div className="msg"><div className="av a">AI</div>
          <div className="bub" style={{color:"var(--dim)"}}>{t("searching")}</div></div>}
      </div>
      <div className="hints">{HINTS.map((h,i)=>
        <button key={i} onClick={()=>send(h)}>{h.length>52?h.slice(0,52)+"…":h}</button>)}</div>
      <div className="comp">
        <input value={text} placeholder={t("composer_ph")}
          onChange={e=>setText(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&send()}/>
        <button onClick={()=>send()} disabled={busy||!text.trim()}>{t("send")}</button>
      </div>
    </div>

    <div className="col r"><Reasoning tr={lastTrace} meta={meta}/></div>
  </div>;
}

/* ------------------------------------------------------------- toggles ---- */
function ThemeToggle(){
  const {t}=useLang();
  const THEMES={auto:{icon:"◐",label:t("theme_auto"),next:"light"},
                light:{icon:"☀",label:t("theme_light"),next:"dark"},
                dark:{icon:"☾",label:t("theme_dark"),next:"auto"}};
  const [mode,setMode]=useState(()=>{
    try{ const v=localStorage.getItem("tj-theme"); return v==="light"||v==="dark"?v:"auto" }
    catch(e){ return "auto" }
  });
  useEffect(()=>{
    const el=document.documentElement;
    // Suppress transitions for the swap: a transitioned property whose value
    // comes from a custom property gets pinned when that property changes.
    el.classList.add("theme-switching");
    void el.offsetHeight;   // flush styles so transition:none is live BEFORE the swap
    if(mode==="auto") delete el.dataset.theme; else el.dataset.theme=mode;
    try{ mode==="auto"? localStorage.removeItem("tj-theme") : localStorage.setItem("tj-theme",mode) }catch(e){}
    const id=setTimeout(()=>el.classList.remove("theme-switching"),120);
    return ()=>clearTimeout(id);
  },[mode]);
  useEffect(()=>{
    if(mode!=="auto"||!window.matchMedia) return;
    const mq=window.matchMedia("(prefers-color-scheme: dark)");
    const el=document.documentElement;
    let id;
    const on=()=>{ el.classList.add("theme-switching");
      clearTimeout(id); id=setTimeout(()=>el.classList.remove("theme-switching"),120); };
    mq.addEventListener("change",on);
    return ()=>{ mq.removeEventListener("change",on); clearTimeout(id); };
  },[mode]);
  const th=THEMES[mode];
  return <button className="theme-btn" onClick={()=>setMode(th.next)} title={t("theme_tip",th.label)}>
    <span className="ti">{th.icon}</span>{th.label}</button>;
}

function LangToggle(){
  const {lang,setLang,t}=useLang();
  return <button className="theme-btn" onClick={()=>setLang(lang==="zh"?"en":"zh")} title={t("lang_tip")}>
    <span className="ti">🌐</span>{lang==="zh"?"EN":"中文"}</button>;
}

/* ================================================================  APP ==== */
function App(){
  const L=useLangState();
  const {t}=L;
  const [meta,setMeta]=useState(null);
  const [err,setErr]=useState(null);
  const [tab,setTab]=useState("replay");
  useEffect(()=>{api("/api/meta").then(setMeta).catch(e=>setErr(e.message))},[]);

  return <LangCtx.Provider value={L}>
    {err? <div className="boot"><div>⚠ {t("boot_fail")}<br/><span style={{fontSize:12}}>{err}</span></div></div>
    : !meta? <div className="boot"><div><div className="spin"/>
        <div style={{marginTop:12}}>{t("boot_building")}</div>
        <div style={{fontSize:11,color:"var(--dim)",marginTop:5}}>{t("boot_once")}</div></div></div>
    : <>
      <div className="hdr">
        <div className="brand"><div className="dot"/>Shopping Copilot
          <small>TechJam · Conversational Search</small></div>
        <div className="tabs">
          <button className={tab==="replay"?"on":""} onClick={()=>setTab("replay")}>{t("tab_replay")}</button>
          <button className={tab==="live"?"on":""} onClick={()=>setTab("live")}>{t("tab_live")}</button>
        </div>
        <div className="chips">
          <span className="chip win">Score <b>{meta.benchmark?.recommended_technical_score?.toFixed(4)??"—"}</b></span>
          <span className="chip base">Baseline <b>{meta.baseline.technical_score.toFixed(4)}</b></span>
          <span className="chip">Hit@10 <b>{meta.benchmark?.hit_rate_at_10?.toFixed(3)??"—"}</b></span>
          <span className="chip">MRR <b>{meta.benchmark?.mrr?.toFixed(4)??"—"}</b></span>
          <span className="chip">MTTC <b>{meta.benchmark?.mttc?.toFixed(2)??"—"}</b></span>
          <span className="chip">Tokens <b>0</b></span>
        </div>
        <LangToggle/>
        <ThemeToggle/>
      </div>
      {tab==="replay"? <Replay meta={meta}/> : <Live meta={meta}/>}
    </>}
  </LangCtx.Provider>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
